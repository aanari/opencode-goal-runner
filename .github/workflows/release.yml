name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release binaries
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install cross-build tools
        run: |
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install cargo-zigbuild --locked
          fi
          brew list zig >/dev/null 2>&1 || brew install zig

      - name: Build release artifacts
        run: ./build-release.sh --check

      - name: Checksums
        run: shasum -a 256 dist/* > dist/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: opencode-goal-runner-release
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes "Release ${GITHUB_REF_NAME}"
